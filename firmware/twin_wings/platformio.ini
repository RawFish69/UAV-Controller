; Twin Motor Flying Wing firmware
; 2 motors through ESCs, 2 elevon servos, optional IMU/GPS.

[platformio]
default_envs = twin_wings_esp32c3

[env:twin_wings_esp32c3]
platform = espressif32@^6.5.0
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200

[env:twin_wings_esp32]
platform = espressif32@^6.5.0
board = esp32dev
framework = arduino
monitor_speed = 115200

[env:twin_wings_f411]
platform = ststm32
board = blackpill_f411ce
framework = arduino
monitor_speed = 115200

[env:twin_wings_f405]
platform = ststm32
board = genericSTM32F405RG
framework = arduino
monitor_speed = 115200
